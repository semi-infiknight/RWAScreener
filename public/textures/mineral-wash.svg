<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 512 512" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="mineral" x="0%" y="0%" width="100%" height="100%" filterUnits="objectBoundingBox" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.011 0.013" numOctaves="4" seed="11" stitchTiles="stitch" result="a"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.04 0.045" numOctaves="3" seed="29" stitchTiles="stitch" result="b"/>
      <feTurbulence type="turbulence" baseFrequency="0.75 0.8" numOctaves="2" seed="5" stitchTiles="stitch" result="g"/>
      <feColorMatrix in="a" type="matrix" values="0 0 0 0 0.07  0 0 0 0 0.07  0 0 0 0 0.075  0 0 0 0.65 0" result="a2"/>
      <feColorMatrix in="b" type="matrix" values="0 0 0 0 0.12  0 0 0 0 0.12  0 0 0 0 0.125  0 0 0 0.4 0" result="b2"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.16  0 0 0 0 0.16  0 0 0 0 0.165  0 0 0 0.18 0" result="g2"/>
      <feBlend in="a2" in2="b2" mode="screen" result="m"/>
      <feBlend in="m" in2="g2" mode="screen" result="out"/>
      <feComponentTransfer in="out">
        <feFuncR type="gamma" amplitude="1.05" exponent="1.4" offset="0.03"/>
        <feFuncG type="gamma" amplitude="1.02" exponent="1.4" offset="0.03"/>
        <feFuncB type="gamma" amplitude="1.08" exponent="1.42" offset="0.032"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#0c0c0e"/>
  <rect width="512" height="512" filter="url(#mineral)"/>
</svg>
